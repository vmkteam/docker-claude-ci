<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #24292f; }
        h1, h2 { border-bottom: 1px solid #d1d9e0; padding-bottom: .3em; }
        h1 { font-size: 1.6em; }
        h2 { font-size: 1.3em; }
        code { background: #f6f8fa; padding: 2px 6px; border-radius: 4px; font-size: 85%; }
        pre { background: #f6f8fa; padding: 16px; border-radius: 6px; overflow-x: auto; }
        pre code { background: none; padding: 0; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #d1d9e0; padding: 8px 12px; text-align: left; }
        th { background: #f6f8fa; font-weight: 600; }
        blockquote { border-left: 4px solid #d1d9e0; margin: 0; padding: 0 16px; color: #636c76; }
        hr { border: none; border-top: 1px solid #d1d9e0; margin: 24px 0; }
        a { color: #0969da; text-decoration: none; }
        a:hover { text-decoration: underline; }
        strong { font-weight: 600; }
        ul, ol { padding-left: 2em; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css">
</head>
<body>
{{BODY}}
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<script>hljs.highlightAll();</script>
</body>
</html>
